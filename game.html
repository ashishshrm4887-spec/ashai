<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Slimebound — Game 0.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111a;color:#e8f3ff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}.wrap{width:min(1100px,100%);padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.brand{font-weight:900;font-size:22px}.brand b{color:#55e6a5}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#0d1d29;border:1px solid #193548;border-radius:999px;padding:7px 11px;font-size:12px}.game{position:relative;border:1px solid #21455b;border-radius:18px;overflow:hidden;background:#0a1b20;box-shadow:0 18px 70px #0008}.hud{position:absolute;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.bar{width:145px;height:14px;background:#12242c;border:1px solid #294652;border-radius:99px;overflow:hidden}.fill{height:100%;transition:width .25s}.hp{background:#ef6075}.xp{background:#7c6cff}.hudbox{background:#07131bd9;border:1px solid #294452;border-radius:12px;padding:8px 10px;font-size:12px}.canvasbox{width:100%;aspect-ratio:16/9;min-height:330px}.canvasbox canvas{display:block;width:100%;height:100%;image-rendering:auto}.battle{position:absolute;inset:0;z-index:10;background:#07111aec;display:none;align-items:flex-end;padding:16px}.battle.show{display:flex}.panel{width:100%;background:#0b1c27eF;border:1px solid #2b5365;border-radius:18px;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.enemy{text-align:center}.enemy .monster{font-size:70px;filter:drop-shadow(0 10px 10px #0008)}.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #2c5262;background:#102936;color:#eef8ff;border-radius:12px;padding:11px;font-weight:800;cursor:pointer}.btn:active{transform:scale(.97)}.btn.attack{background:#164533;border-color:#286d4f}.log{grid-column:1/-1;color:#a9c4d3;font-size:13px;min-height:22px}.controls{display:flex;justify-content:center;gap:8px;margin:10px 0}.dpad{display:grid;grid-template-columns:repeat(3,48px);gap:5px}.dpad button{height:42px}.help{font-size:12px;color:#7693a3;text-align:center;margin-top:8px}@media(max-width:650px){.panel{grid-template-columns:1fr}.canvasbox{aspect-ratio:4/3;min-height:360px}.hudbox{padding:6px 8px}.bar{width:105px}.enemy .monster{font-size:56px}.moves{grid-template-columns:1fr 1fr}.stats{display:none}}
</style></head>
<body><div class="wrap"><div class="top"><div class="brand">SLIME<span>BOUND</span> <small style="font-size:10px;color:#7593a3">0.1</small></div><div class="stats"><div class="pill">🗺️ Whispering Forest</div><div class="pill">🎮 Explore</div></div></div>
<div class="game"><div class="hud"><div class="hudbox"><b>🟢 Slime</b><div style="display:flex;align-items:center;gap:6px;margin-top:5px">HP <div class="bar"><div id="hpbar" class="fill hp" style="width:100%"></div></div></div></div><div class="hudbox"><b id="level">Lv. 1</b><div style="display:flex;align-items:center;gap:6px;margin-top:5px">XP <div class="bar"><div id="xpbar" class="fill xp" style="width:0%"></div></div></div></div></div>
<div class="canvasbox"><canvas id="c" width="960" height="540"></canvas></div>
<div id="battle" class="battle"><div class="panel"><div class="enemy"><div style="font-size:12px;color:#9eb7c4">WILD MONSTER</div><div id="enemyEmoji" class="monster">🐺</div><b id="enemyName">Forest Wolf</b><div style="margin-top:6px"><div class="bar" style="margin:auto"><div id="enemybar" class="fill hp" style="width:100%"></div></div></div></div><div><b>⚔️ Battle</b><div class="moves" style="margin-top:10px"><button class="btn attack" onclick="attack()">💥 Slime Bash</button><button class="btn" onclick="skill()">✨ Splash</button><button class="btn" onclick="heal()">💚 Recover</button><button class="btn" onclick="runAway()">🏃 Run</button></div></div><div id="log" class="log">A wild Forest Wolf appeared!</div></div></div></div>
<div class="controls"><div class="dpad"><span></span><button class="btn" onclick="move(0,-1)">▲</button><span></span><button class="btn" onclick="move(-1,0)">◀</button><button class="btn" onclick="move(0,1)">▼</button><button class="btn" onclick="move(1,0)">▶</button></div></div><div class="help">Explore with WASD / arrow keys or the controls. Walk into a wild monster to battle. Save anytime.</div><div style="display:flex;justify-content:center;gap:8px;margin:12px 0"><button class="btn" onclick="saveGame()">💾 Save</button><button class="btn" onclick="loadGame()">📂 Load</button><button class="btn" onclick="resetGame()">↻ Reset</button></div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let p={x:480,y:300,hp:100,maxHp:100,xp:0,level:1},enemy=null,keys={};
const trees=[...Array(28)].map((_,i)=>({x:35+(i*137)%880,y:70+(i*83)%410}));
function draw(){ctx.clearRect(0,0,c.width,c.height);let g=ctx.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#123b36');g.addColorStop(1,'#081e21');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#164b43';ctx.lineWidth=2;for(let x=0;x<c.width;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}for(let y=0;y<c.height;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}trees.forEach(t=>{ctx.fillStyle='#12382f';ctx.beginPath();ctx.arc(t.x,t.y,25,0,7);ctx.fill();ctx.fillStyle='#1d684d';ctx.beginPath();ctx.arc(t.x-7,t.y-7,20,0,7);ctx.fill();ctx.fillStyle='#5c3f2a';ctx.fillRect(t.x-4,t.y+15,8,18)});ctx.fillStyle='#7ee6bd';ctx.font='bold 12px system-ui';ctx.fillText('WHISPERING FOREST',22,36);ctx.shadowColor='#56e6a5';ctx.shadowBlur=20;ctx.fillStyle='#62e6aa';ctx.beginPath();ctx.ellipse(p.x,p.y+8,25,17,0,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#062018';ctx.beginPath();ctx.arc(p.x-8,p.y+3,3,0,7);ctx.arc(p.x+8,p.y+3,3,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-7,p.y+2,1,0,7);ctx.arc(p.x+9,p.y+2,1,0,7);ctx.fill();requestAnimationFrame(draw)}
function move(dx,dy){if(enemy)return;p.x=Math.max(30,Math.min(930,p.x+dx*32));p.y=Math.max(65,Math.min(505,p.y+dy*32));if(Math.random()<.13)startBattle()}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){e.preventDefault();if(k==='w'||k==='arrowup')move(0,-1);if(k==='s'||k==='arrowdown')move(0,1);if(k==='a'||k==='arrowleft')move(-1,0);if(k==='d'||k==='arrowright')move(1,0)}});
function startBattle(){enemy={hp:60,max:60,name:'Forest Wolf',emoji:'🐺'};document.getElementById('enemyEmoji').textContent=enemy.emoji;document.getElementById('enemyName').textContent=enemy.name;document.getElementById('battle').classList.add('show');log('A wild Forest Wolf appeared!')}
function attack(){if(!enemy)return;let d=12+Math.floor(Math.random()*9);enemy.hp-=d;log('Slime Bash dealt '+d+' damage!');if(enemy.hp<=0){win();return}enemyTurn()}
function skill(){if(!enemy)return;let d=20+Math.floor(Math.random()*10);enemy.hp-=d;log('Splash dealt '+d+' damage!');if(enemy.hp<=0){win();return}enemyTurn()}
function heal(){if(!enemy)return;p.hp=Math.min(p.maxHp,p.hp+18);log('Slime recovered 18 HP.');enemyTurn()}
function enemyTurn(){let d=7+Math.floor(Math.random()*8);p.hp=Math.max(0,p.hp-d);if(p.hp<=0){p.hp=1;log('The slime barely escaped defeat!');}else log('Forest Wolf attacked for '+d+' damage.');update()}
function win(){enemy=null;document.getElementById('battle').classList.remove('show');let gain=25;p.xp+=gain;log('');if(p.xp>=100){p.xp-=100;p.level++;p.maxHp+=15;p.hp=p.maxHp;alert('LEVEL UP! Slime is now Lv. '+p.level)}update()}
function runAway(){enemy=null;document.getElementById('battle').classList.remove('show')}
function log(t){document.getElementById('log').textContent=t;update()}
function update(){document.getElementById('hpbar').style.width=(p.hp/p.maxHp*100)+'%';document.getElementById('xpbar').style.width=(p.xp)+'%';document.getElementById('level').textContent='Lv. '+p.level; if(enemy)document.getElementById('enemybar').style.width=Math.max(0,enemy.hp/enemy.max*100)+'%'}
function saveGame(){localStorage.setItem('slimebound-save',JSON.stringify(p));alert('Game saved!')}
function loadGame(){let s=localStorage.getItem('slimebound-save');if(s){p=JSON.parse(s);update();alert('Game loaded!')}else alert('No save found.')}
function resetGame(){if(confirm('Reset your progress?')){p={x:480,y:300,hp:100,maxHp:100,xp:0,level:1};localStorage.removeItem('slimebound-save');update()}}
draw();update();
</script></body></html>
